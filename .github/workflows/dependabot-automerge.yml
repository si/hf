name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Build & test every Dependabot PR ─────────────────────────────────────
  build-test:
    name: Build & Test
    if: |
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  # ── 2. Post a notification when a Dependabot PR is merged ───────────────────
  notify-merged:
    name: Notify Merged
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Post merge notification comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = (pr.merge_commit_sha ?? '').substring(0, 7);
            const mergedBy = pr.merged_by?.login ?? 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '## ✅ Dependabot PR Merged',
                '',
                `**${pr.title}** has been merged into \`${pr.base.ref}\`.`,
                '',
                `- Merged by: @${mergedBy}`,
                `- Merge commit: \`${sha}\``,
              ].join('\n'),
            });
